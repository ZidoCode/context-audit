name: context-audit
version: "0.1.0"
description: Context-window forensics for Hermes Agent — per-turn token estimates, the single largest tool output of each turn, oversized tool calls, and compaction events, recorded as metadata only in a local SQLite audit DB. Observer-only, stdlib-only, fails open.
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - post_auxiliary_call
